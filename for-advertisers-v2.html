<!-- ============ CRITICAL / TOKEN CSS (inlined per brief: no render-blocking) ============ -->
<style>
/* Metric-matched fallback fonts: the web fonts swap in with ~no reflow (fixes the hero CLS). */
@font-face{font-family:'Jakarta Fallback';src:local('Arial');size-adjust:105.96%;ascent-override:97.5%;descent-override:24.43%;line-gap-override:0%;}
@font-face{font-family:'Inter Fallback';src:local('Arial');size-adjust:107.4%;ascent-override:90.49%;descent-override:22.56%;line-gap-override:0%;}
:root{
  /* Brand */
  --midnight:#0F1C2E; --midnight-mid:#1A2E47; --midnight-soft:#243856;
  --midnight-light:#3D5A80; --midnight-light-tint:rgba(61,90,128,.12);
  --ember:#F05826; --ember-dark:#C43E18; --ember-light:#FF7A45; --ember-tint:rgba(240,88,38,.10);
  /* Warm neutrals */
  --warm-50:#FAFAF8; --warm-100:#F4F4F0; --warm-200:#E8E8E2; --warm-300:#D2D2CC;
  --warm-400:#706F6B; --warm-600:#4B4B46; --warm-800:#1F1F1A; --warm-900:#111110;
  /* Status */
  --success:#10B981; --warning:#F59E0B; --error:#EF4444; --info:#3B82F6;
  /* Gradients */
  --grad-ember:linear-gradient(135deg,#F05826,#C43E18);
  --grad-midnight:linear-gradient(135deg,#0F1C2E,#1A3251);
  --grad-midnight-light:linear-gradient(135deg,#3D5A80,#1A2E47);
  /* Radius */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:9999px;
  /* Shadows — always Midnight-tinted */
  --shadow-sm:0 1px 3px rgba(15,28,46,.06);
  --shadow-md:0 4px 12px rgba(15,28,46,.08);
  --shadow-lg:0 10px 30px rgba(15,28,46,.10);
  --shadow-xl:0 24px 60px rgba(15,28,46,.16);
  --shadow-ember:0 8px 24px rgba(240,88,38,.22);
  --shadow-ml:0 8px 24px rgba(61,90,128,.22);
  /* Type */
  --font-display:'Plus Jakarta Sans','Jakarta Fallback',-apple-system,sans-serif;
  --font-body:'Inter','Inter Fallback',-apple-system,sans-serif;
  /* Motion */
  --fast:150ms cubic-bezier(.4,0,.2,1);
  --base:200ms cubic-bezier(.4,0,.2,1);
  --spring:300ms cubic-bezier(.34,1.56,.64,1);
  /* Layout */
  --maxw:1200px;
  --hex:3; /* hexagon motif intensity 0..10, overridden by tweak */
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html.lenis,html.lenis body{height:auto;}
.lenis.lenis-smooth{scroll-behavior:auto !important;}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain;}
.lenis.lenis-stopped{overflow:hidden;}
body{
  margin:0; background:var(--warm-50); color:var(--warm-900);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; line-height:1.1; margin:0; letter-spacing:-.02em; color:var(--warm-900);}
p{margin:0;}
a{color:inherit; text-decoration:none;}
img{display:block; max-width:100%;}
ul{margin:0; padding:0; list-style:none;}
:focus-visible{outline:3px solid var(--ember); outline-offset:2px; border-radius:4px;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px;}
.eyebrow{font:600 12px/1 var(--font-body); letter-spacing:.14em; text-transform:uppercase; color:var(--warm-400);}

/* ---------- Buttons (pill always; hover scale 1.02) ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font:600 15px/1 var(--font-body); border-radius:var(--r-full); border:1.5px solid transparent;
  padding:14px 26px; cursor:pointer; transition:transform var(--fast), box-shadow var(--fast), background var(--fast);
  white-space:nowrap; text-align:center;
}
.btn:hover{transform:scale(1.02);}
.btn-primary{background:var(--grad-ember); color:#fff; box-shadow:var(--shadow-ember);}      /* Publisher */
.btn-primary:hover{box-shadow:none;}  /* brand guideline: ember CTAs drop their shadow on hover */
.btn-advertiser{background:var(--grad-midnight-light); color:#fff; box-shadow:var(--shadow-ml);} /* Advertiser */
.btn-midnight{background:var(--grad-midnight); color:var(--warm-50); box-shadow:var(--shadow-md);} /* neutral corporate */
.btn-secondary{background:#fff; color:var(--midnight); border-color:var(--warm-300);}
.btn-secondary:hover{border-color:var(--midnight);}
.btn-ghost{background:transparent; color:var(--ember); padding-left:6px; padding-right:6px;}
.btn-ghost.adv{color:var(--midnight-light);}
.btn-lg{padding:17px 32px; font-size:16px;}
.btn-outline-ember{background:#fff; color:var(--ember-dark); border-color:var(--ember);}
.btn-outline-adv{background:#fff; color:var(--midnight-light); border-color:var(--midnight-light);}
.btn-block{width:100%;}

/* ---------- Hexagon motif ---------- */
.hex-clip{clip-path:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 25%,6.7% 75%);}
/* fluted = subtle vertical ridges */
.flute{
  background-image:repeating-linear-gradient(90deg,
    rgba(15,28,46,.05) 0 1px, transparent 1px 11px);
}
.flute-dark{
  background-image:repeating-linear-gradient(90deg,
    rgba(255,255,255,.05) 0 1px, transparent 1px 13px);
}

/* ---------- Animated honeycomb field (closing CTA) ---------- */
/* Exact Figma honeycomb (Hexagon shape.svg): pointy-top warm-grey hexes on
   off-white gaps, per-hex opacity fades the field up from the solid CTA into
   the blog section. Stagger-blooms in from the headline, then breathes subtly. */
.hex-field{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  animation:hfDrift 32s ease-in-out infinite;}
.hf-svg{position:absolute; left:50%; bottom:-32px; transform:translateX(-50%);
  width:100%; min-width:1460px; height:auto; display:block;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 16%, #000 100%);
  mask-image:linear-gradient(to bottom, transparent 0%, #000 16%, #000 100%);}
.hf-hex{fill:var(--warm-200); fill-opacity:.72; stroke:var(--warm-50); stroke-width:1.5;
  opacity:0; transform:scale(.42); transform-box:fill-box; transform-origin:center;
  transition:opacity 1.2s ease, transform 1.5s cubic-bezier(.34,1.4,.5,1);}
.hex-field.hf-in .hf-hex{opacity:var(--op); transform:scale(1);}
.hex-field.hf-in .hf-hex.hf-breathe{animation:hfBreathe var(--bdur) ease-in-out infinite;}
@keyframes hfBreathe{0%,100%{opacity:var(--op);} 50%{opacity:calc(var(--op) * 0.5);}}
@keyframes hfDrift{0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);}}
@media (prefers-reduced-motion: reduce){
  .hex-field{animation:none !important;}
  .hf-hex{opacity:var(--op) !important; transform:scale(1) !important; transition:none !important; animation:none !important;}
}

/* ---------- arrow link (descriptive text, no "More") ---------- */
.alink{display:inline-flex; align-items:center; gap:7px; font-weight:600; color:var(--ember); transition:gap var(--fast);}
.alink.adv{color:var(--midnight-light);}
.alink:hover{gap:11px;}
.alink svg{width:16px;height:16px;}

/* tag / badge */
.tag{display:inline-flex; align-items:center; gap:6px; font:600 12px/1 var(--font-body); padding:6px 11px; border-radius:var(--r-full);}
.tag-pub{background:var(--ember-tint); color:var(--ember-dark);}
.tag-adv{background:var(--midnight-light-tint); color:var(--midnight-light);}

section{position:relative;}
.sec-pad{padding:96px 0;}
.sec-head{max-width:680px;}
.sec-head h2{font-size:clamp(28px,3.6vw,40px); margin:14px 0 0;}
.sec-head p{margin-top:16px; font-size:18px; color:var(--warm-600);}

/* ---------- Scroll-reveal (gentle, reduced-motion safe) ---------- */
[data-reveal]{opacity:0; transform:translateY(22px); transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);}
[data-reveal].in{opacity:1; transform:none;}
[data-reveal][data-reveal-delay="1"]{transition-delay:.08s;}
[data-reveal][data-reveal-delay="2"]{transition-delay:.16s;}
[data-reveal][data-reveal-delay="3"]{transition-delay:.24s;}
@media (prefers-reduced-motion: reduce){
  [data-reveal]{opacity:1 !important; transform:none !important; transition:none !important;}
}

/* ---------- Offers: LINE-style left category rail + brand grid ---------- */
.offers-layout{display:grid; grid-template-columns:236px 1fr; gap:44px; align-items:start; margin-top:40px;}
.offer-rail{display:flex; flex-direction:column; gap:4px; position:sticky; top:96px;}
.offer-rail-tab{display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  padding:14px 16px; border-radius:var(--r-md); cursor:pointer; font:600 16px/1.25 var(--font-body);
  border:none; background:transparent; color:var(--warm-600); transition:background .15s, color .15s;}
.offer-rail-tab:hover{background:var(--warm-100); color:var(--midnight);}
.offer-rail-tab[aria-selected="true"]{background:var(--midnight); color:var(--warm-50);}
.offer-rail-tab .chev{margin-left:auto; flex:0 0 auto; display:flex; opacity:0; transform:translateX(-5px);
  transition:opacity .15s, transform .15s;}
.offer-rail-tab[aria-selected="true"] .chev{opacity:1; transform:none;}
.offer-rail-count{font-size:13px; font-weight:600; color:var(--warm-400); margin:18px 0 0 16px;}

.offer-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}

@media (max-width:900px){
  .offers-layout{grid-template-columns:1fr; gap:24px; margin-top:28px;}
  .offer-rail{flex-direction:row; position:static; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; padding-bottom:6px; margin-inline:-4px; padding-inline:4px;}
  .offer-rail::-webkit-scrollbar{display:none;}
  .offer-rail-tab{flex:0 0 auto; width:auto; padding:10px 18px; border-radius:var(--r-full);
    border:1.5px solid var(--warm-300); white-space:nowrap; font-size:14px;}
  .offer-rail-tab:hover{background:#fff; border-color:var(--midnight);}
  .offer-rail-tab[aria-selected="true"]{border-color:var(--midnight);}
  .offer-rail-tab .chev{display:none;}
  .offer-rail-count{display:none;}
  .offer-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:560px){ .offer-grid{grid-template-columns:1fr;} }

@keyframes offerIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
/* ---------- Large brand-forward offer cards (Figma) ----------
   Logo top-left, arrow top-right (hover only), brand + commission anchored to the
   bottom. Commission number is the Ember co-hero (large-text, accessible on white).
   No category tag inside the card. */
.offer-card{position:relative; display:flex; flex-direction:column; background:#fff; border-radius:var(--r-lg);
  border:1px solid var(--warm-200); box-shadow:var(--shadow-sm); padding:26px 26px 28px; cursor:pointer; overflow:hidden;
  min-height:250px; text-decoration:none;
  transition:transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s, border-color .22s;
  animation:offerIn .5s cubic-bezier(.22,1,.36,1) both;}
.offer-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg); border-color:var(--warm-300);}
.offer-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
.offer-logo{flex:0 0 auto; height:50px; display:flex; align-items:center; justify-content:flex-start;}
.offer-logo img{height:100%; width:auto; max-width:130px; object-fit:contain; object-position:left center; display:block;}
.offer-logo span{width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  background:var(--grad-midnight-light, var(--midnight)); color:#fff;
  font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-.02em;}
/* arrow, top-right — appears only on hover (Figma) */
.offer-arrow{flex:0 0 auto; display:flex; color:var(--midnight); opacity:0; transform:translate(-3px,3px);
  transition:opacity .2s ease, transform .2s ease;}
.offer-card:hover .offer-arrow{opacity:1; transform:none;}
.offer-foot{margin-top:auto; padding-top:28px;}
.offer-brand{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--warm-900); letter-spacing:-.01em;}
.offer-comm{margin-top:12px;}
.offer-up{display:block; font:600 12px/1 var(--font-body); color:var(--warm-400); margin-bottom:3px;}
.offer-rate{font-family:var(--font-display); font-weight:800; font-size:clamp(19px,1.6vw,23px); color:var(--warm-800); letter-spacing:-.01em;}
.offer-num{color:var(--ember);}
@media (prefers-reduced-motion: reduce){ .offer-card{animation:none;} .offer-arrow{transition:none;} }

/* ---------- hero: left-aligned copy over a right-side brand video background ---------- */
/* .hero-copy is a plain .wrap (inherits its max-width + auto-centering + gutter), so its
   L/R padding matches the #how section. Content is left-aligned; the big header overlaps
   the video, which sits behind as a background layer. */
.hero-copy{text-align:left; display:flex; flex-direction:column; align-items:flex-start; width:100%;}  /* fill the flex hero so the .wrap max-width+gutter match #how */
/* Video occupies the RIGHT portion of the hero, centered + blended into the warm base
   (same browser-tuned blend/opacity as the full-bleed version). */
.hero-video-wrap{position:absolute; top:0; right:0; bottom:0; left:auto; width:42%; z-index:1; display:flex; align-items:center; justify-content:center; pointer-events:none; overflow:hidden; isolation:isolate; background:var(--warm-50);}
/* Filter + blend live on this wrapper div (not the <video>) so Safari/WebKit actually apply them — WebKit drops CSS filter/blend painted directly on a composited <video> layer. */
.hero-video-fx{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; mix-blend-mode:multiply; -webkit-filter:brightness(1.2) saturate(1.05) contrast(1.05); filter:brightness(1.2) saturate(1.05) contrast(1.05);}
.hero-video{aspect-ratio:1/1; height:min(560px,66vh); width:auto; max-width:94%; object-fit:contain; opacity:.32; will-change:transform, opacity;}
/* Safari/WebKit won't composite `multiply` on a filtered layer holding a <video>, but it does composite `darken` here — which drops the near-white video bg against warm-50 and keeps the dark hex lines, the same look multiply gives in Chrome. */
@supports (-webkit-hyphens:none){
  .hero-video-fx{mix-blend-mode:darken;}
  .hero-video{opacity:.14;}
}
@media (max-width:860px){
  /* stack: copy centered, video a full-bleed subtle backdrop behind it */
  .hero-copy{align-items:center; text-align:center; max-width:none; margin-inline:auto;}
  .hero-video-wrap{inset:0; left:0; width:auto;}
}

/* ---------- auto-sliding + draggable logo marquee (Change 5) ---------- */
/* grabbable; touch-action:pan-y keeps vertical page scroll while we own horizontal drag.
   Edge mask fades logos in/out at the container edges so the row never reads as busy. */
.marquee{overflow:hidden; width:100%; cursor:grab; touch-action:pan-y; user-select:none;
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
          mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);}
.marquee.grabbing{cursor:grabbing;}
.marquee-track{display:flex; align-items:center; gap:64px; width:max-content; will-change:transform; filter:grayscale(100%); transition:filter .4s ease;}
.marquee-track span{font-family:var(--font-display); font-weight:700; font-size:clamp(22px,2.6vw,34px); color:var(--warm-300); white-space:nowrap; letter-spacing:-.01em; transition:color .25s;}
/* subtle: grey at rest, eases to colour on hover */
.marquee:hover .marquee-track{filter:grayscale(0%);}
.marquee:hover .marquee-track span{color:var(--warm-400);}
.trust-logo{height:clamp(48px,5vw,64px); width:auto; max-width:210px; object-fit:contain; display:block; flex:0 0 auto; opacity:.9; -webkit-user-drag:none; user-drag:none; pointer-events:none;}

/* ---------- Lucien-style horizontal pinned scroll ---------- */
.hpin{position:relative;}
.hpin-sticky{position:sticky; top:0; height:100vh; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch;}
.hpin-sticky>.wrap{align-self:stretch; width:100%; box-sizing:border-box;}
.hpin-track{display:flex; gap:28px; padding:0 max(32px,calc((100vw - var(--maxw))/2)); will-change:transform;}
.hpin-card{flex:0 0 auto; width:min(440px,78vw);}
.hpin-progress{height:4px; background:var(--warm-200); border-radius:9999px; overflow:hidden;}
.hpin-progress>i{display:block; height:100%; background:var(--grad-ember); width:0;}
@media (max-width: 860px){
  /* fall back to normal vertical stack — no scroll-jacking on mobile */
  .hpin{height:auto !important;}
  .hpin-sticky{position:static; height:auto; display:block;}
  .hpin-track{flex-direction:column; transform:none !important; padding:0 20px;}
  .hpin-card{width:auto;}
  .hpin-progress{display:none;}
}

/* ---------- Network morph CTA (pinned, scroll-scrubbed: logomark → two doors) ---------- */
.nm-wrap{position:relative; background:transparent;}  /* rides the surface, which has eased back to bright by the CTA */
.nm-stage{height:100vh; overflow:hidden; perspective:1200px;}  /* pinned by ScrollTrigger, not CSS sticky */
.nm-head{position:absolute; left:50%; top:24%; transform:translateX(-50%); width:min(900px,92vw); text-align:center; z-index:3; pointer-events:none;}
.nm-head h2{font-size:clamp(40px,6.4vw,76px); line-height:1.04; letter-spacing:-.02em; color:var(--midnight);}  /* dark on the bright CTA surface */
.nm-head p{margin-top:18px; font-size:18px; color:var(--warm-600); max-width:600px; margin-inline:auto;}
.nm-label{position:absolute; left:50%; top:calc(58% - 48px); transform:translate(-50%,-50%) translateX(var(--x,0));
  z-index:3; font:600 15px/1 var(--font-body); letter-spacing:.04em; color:var(--warm-400); white-space:nowrap; pointer-events:none;}
.nm-door{position:absolute; left:50%; top:58%; display:inline-flex; align-items:center; justify-content:center;
  width:200px; height:58px; border-radius:var(--r-full); color:#fff; background:var(--midnight); cursor:pointer; z-index:4;
  font:600 16px/1 var(--font-body); white-space:nowrap; box-shadow:none; transform-style:preserve-3d;
  pointer-events:none;
  will-change:transform,width,height,clip-path,border-radius,background-color;}
/* hover (like hero): scale handled by GSAP; this class drops the ember CTA's shadow */
.nm-door.nm-pub.is-live.nm-hovered{box-shadow:0 8px 24px rgba(240,88,38,0);}
/* the doors become the real, clickable CTAs (with hero shadow + hover) only once fully morphed — `is-live` set by ScrollTrigger progress */
.nm-door.is-live{pointer-events:auto;}
/* keep the shadow geometry constant and animate only its alpha (transitioning box-shadow from `none` doesn't work) */
.nm-door.nm-adv{box-shadow:0 8px 24px rgba(61,90,128,0);}
.nm-door.nm-pub{box-shadow:0 8px 24px rgba(240,88,38,0);}
.nm-door.nm-adv.is-live{box-shadow:0 8px 24px rgba(61,90,128,.22);}   /* --shadow-ml */
.nm-door.nm-pub.is-live{box-shadow:0 8px 24px rgba(240,88,38,.22);}   /* --shadow-ember */
.nm-door.nm-pub.is-live:hover{box-shadow:0 8px 24px rgba(240,88,38,0);}  /* ember CTA drops its shadow on hover, like the hero */
/* animated ember↔midnight-light gradient RIM (brand-motion motif). Sits full-bleed behind
   .nm-fill, so during the hexagon/outline stages it shows only through the ~5px rim → the
   hexagon border flows between the two brand tones. Once the doors fill (.nm-grad fades in on
   top) and morph to pills, this layer is fully covered, so the choreography is untouched. */
.nm-door .nm-rim{position:absolute; inset:0; z-index:0; pointer-events:none; border-radius:inherit;
  background:linear-gradient(120deg,#F05826 0%,#3D5A80 50%,#F05826 100%); background-size:220% 220%;
  animation:nmRimFlow 7s ease-in-out infinite;}
@keyframes nmRimFlow{0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}}
@media (prefers-reduced-motion: reduce){ .nm-door .nm-rim{animation:none;} }
/* hero-CTA gradient fill (clipped to the door's shape by the parent clip-path); fades in as the hexes fill */
.nm-door .nm-grad{position:absolute; inset:0; z-index:0; pointer-events:none; border-radius:inherit;}  /* follow the door's rounding once the clip-path is dropped */
.nm-door .nm-grad-adv{background:var(--grad-midnight-light);}  /* Brand — matches hero "List Your Brand" */
.nm-door .nm-grad-pub{background:var(--grad-ember);}           /* Publisher — matches hero "Start Earning" */
/* image backdrop shown inside the hexagons during the split/spin, faded out before the pill. Set the picture via inline style backgroundImage (swap the url). */
.nm-door .nm-img{position:absolute; inset:0; z-index:1; background-size:cover; background-position:center; pointer-events:none; border-radius:inherit;}
/* outline interior: a page-coloured hexagon inset inside the door, leaving the door bg as a thin rim (logomark look). Faded out as the hexes fill. Sits above the gradient/image so the cross-fade reveals them. */
.nm-door .nm-fill{position:absolute; inset:5px; clip-path:polygon(50% 2%,91.57% 26%,91.57% 74%,50% 98%,8.43% 74%,8.43% 26%); background:var(--warm-50); z-index:2; pointer-events:none;}  /* regular-hexagon proportions — must match NM_HEX */  /* page-colour interior so the dark rim reads as the logomark on the bright surface */
/* hexagon-stage label ("Advertiser"/"Publisher"), shown after the split, faded out on spin */
.nm-door .nm-htext{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; color:#fff; font:700 18px/1 var(--font-display); letter-spacing:-.01em; pointer-events:none;}
.nm-door .nm-dt{position:relative; z-index:3; display:inline-flex; align-items:center; gap:8px; pointer-events:none;}
@media (max-width:860px){ .nm-stage{height:auto; overflow:visible; perspective:none;} }

/* App root hidden until React mounts to avoid flash */
#root:empty::after{content:""; display:block; height:100vh;}
</style>
